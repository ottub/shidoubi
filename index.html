<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カテキ</title>
<style>
  :root { --accent:#3878df; --bg:#ffffff; --fg:#1a1a1a; --muted:#6a6a6a; --line:#e5e8ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111417; --fg:#e9edf0; --muted:#9aa3ab; --line:#2a2f34; } }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;
         background:var(--bg); color:var(--fg); line-height:1.8; text-align:center; }
  .hero { background:linear-gradient(135deg,#385fdf,#2a78d6); color:#fff; padding:72px 24px; }
  .hero h1 { margin:0; font-size:30px; font-weight:700; }
  .hero p { margin:12px 0 0; opacity:.92; font-size:15px; }
  main { max-width:640px; margin:0 auto; padding:40px 24px; }
  a.btn { display:inline-block; margin:8px; padding:12px 22px; border:1px solid var(--line); border-radius:12px; color:var(--accent); text-decoration:none; font-size:15px; }
  footer { color:var(--muted); font-size:12px; padding:24px; }
</style>
</head>
<body>
  <div class="hero">
    <h1>カテキ</h1>
    <p>個人契約の家庭教師を、スマートに。</p>
  </div>
  <main>
    <p>指導日の管理から給料・確定申告、生徒・保護者との連携までを1つにまとめた、個人契約の家庭教師のための管理アプリです。</p>
    <p>
      <a class="btn" href="privacy.html">プライバシーポリシー</a>
      <a class="btn" href="support.html">サポート</a>
    </p>
  </main>
  <footer>© 2026 カテキ</footer>
</body>
</html>
